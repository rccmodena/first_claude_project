name: Bug
description: Something doesn't work as expected
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem objectively.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, project version.
      placeholder: "Python 3.14, Ubuntu 24.04, v0.1.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Remove secrets and personal data before pasting.
      render: shell
